<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pesquisa · Oriente One</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=1.3.0">
<style>
  body { background: var(--bg); }
  .pub-head { background: var(--navy-2); color: #fff; padding: 22px 16px 26px; border-bottom: 4px solid var(--navy); }
  .pub-head .in, .pub-main { max-width: 760px; margin: 0 auto; }
  .pub-head .brand { padding: 0 0 10px; font-size: 11px; }
  .pub-head h1 { color: #fff; font-size: 21px; }
  .pub-head p { color: var(--stat); margin: 6px 0 0; }
  .pub-main { padding: 16px 16px 80px; }
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; }
  .progress .bar { height: 6px; }
  .sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--teal-2); font-weight: 700; margin: 0 0 4px; }
  .item { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item p { margin: 0 0 10px; font-weight: 500; }
  .item p .req { color: var(--red); }
  .item.missing p { color: var(--red); }
  .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  .scale label { flex: 1; min-width: 44px; position: relative; }
  .scale input { position: absolute; opacity: 0; pointer-events: none; }
  .scale span { display: block; text-align: center; padding: 10px 0; border: 1px solid var(--line); border-radius: 8px; font-weight: 700; cursor: pointer; background: #fff; }
  .scale input:checked + span { background: var(--teal); border-color: var(--teal); color: #fff; }
  .scale input:focus-visible + span { outline: 2px solid var(--navy); }
  .scale .na span { font-weight: 500; font-size: 12px; padding: 11px 6px; }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .choices label { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #fff; cursor: pointer; }
  .choices input { width: auto; }
  .nav-btns { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .intro { white-space: pre-line; }
</style>
<script src="/assessment.js?v=1.3.0" type="module"></script>
</head>
<body>
<div id="root"><div class="empty">Carregando pesquisa…</div></div>
<div id="toast"></div>
</body>
</html>
